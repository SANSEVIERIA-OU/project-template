name: SANSEVIERIA License

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  license:
    name: Verify SANSEVIERIA License
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check licence and project notice
        run: python3 tools/check_license.py
      - name: Check rejection of missing or modified terms
        run: python3 tools/test_license_policy.py
